<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2540"/>
      <stop offset="1" stop-color="#14141c"/>
    </linearGradient>
    <linearGradient id="elo" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8ccf4d"/>
      <stop offset="0.3" stop-color="#40cbd8"/>
      <stop offset="0.55" stop-color="#4d8cff"/>
      <stop offset="0.8" stop-color="#d95af2"/>
      <stop offset="1" stop-color="#ffd633"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#7a5cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7a5cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="none" stroke="url(#elo)" stroke-width="8"/>
  <!-- checker hint -->
  <g fill="#ffffff" opacity="0.05">
    <rect x="48" y="48" width="40" height="40"/><rect x="128" y="48" width="40" height="40"/>
    <rect x="88" y="88" width="40" height="40"/><rect x="168" y="88" width="40" height="40"/>
    <rect x="48" y="128" width="40" height="40"/><rect x="128" y="128" width="40" height="40"/>
    <rect x="88" y="168" width="40" height="40"/><rect x="168" y="168" width="40" height="40"/>
  </g>
  <circle cx="128" cy="124" r="100" fill="url(#glow)"/>
  <!-- the ELO meter arc -->
  <path d="M 52 206 A 96 96 0 0 1 204 206" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="14" stroke-linecap="round" transform="translate(0,4)"/>
  <!-- knight -->
  <text x="130" y="196" text-anchor="middle" font-family="DejaVu Sans" font-size="170" fill="#000" fill-opacity="0.35">♞</text>
  <text x="124" y="190" text-anchor="middle" font-family="DejaVu Sans" font-size="170" fill="#1b1b22" stroke="#1b1b22" stroke-width="14" stroke-linejoin="round">♞</text>
  <text x="124" y="190" text-anchor="middle" font-family="DejaVu Sans" font-size="170" fill="#fbf6ea">♞</text>
  <!-- crown -->
  <g transform="translate(176,40) rotate(14)">
    <path d="M0 34 L4 8 L16 22 L26 0 L36 22 L48 8 L52 34 Z" fill="#ffd633" stroke="#1b1b22" stroke-width="4" stroke-linejoin="round"/>
    <rect x="0" y="33" width="52" height="9" rx="2" fill="#ffd633" stroke="#1b1b22" stroke-width="4"/>
  </g>
  <!-- ELO bar arc + knob -->
  <rect x="44" y="214" width="168" height="12" rx="6" fill="#2d2d3a"/>
  <rect x="44" y="214" width="120" height="12" rx="6" fill="url(#elo)"/>
  <circle cx="164" cy="220" r="11" fill="#fff"/>
  <circle cx="164" cy="220" r="6" fill="#d95af2"/>
</svg>
