[package]
name = "funchess"
version = "0.1.0"
edition = "2024"

[dependencies]
macroquad = "0.4.16"
shakmaty = "0.30.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["shape"] }

[profile.release]
strip = true

[patch.crates-io]
miniquad = { path = "vendor/miniquad" }
